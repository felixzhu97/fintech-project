server:
  port: ${PORT:8802}

spring:
  application:
    name: portfolio
  datasource:
    # Override for Postgres, e.g.:
    # SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5433/portfolio
    # SPRING_DATASOURCE_USERNAME=postgres
    # SPRING_DATASOURCE_PASSWORD=postgres
    # SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:finpulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      # Schema owned by Liquibase; Hibernate only validates.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
